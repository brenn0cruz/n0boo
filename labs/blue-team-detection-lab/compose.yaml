services:
  blue-team-lab:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      LAB_DB: /data/lab.sqlite
      LAB_TOKEN: ${LAB_TOKEN:?Set LAB_TOKEN in your local environment}
    volumes:
      - labdata:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
volumes:
  labdata:
