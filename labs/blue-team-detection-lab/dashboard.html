<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue Team Detection Lab</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Segoe UI,sans-serif;background:#0d1117;color:#e6edf3}
body{max-width:1150px;margin:0 auto;padding:34px 18px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
h1{letter-spacing:-1px}small{color:#8b949e}.pill{border:1px solid #30363d;border-radius:20px;padding:5px 12px;color:#3fb950}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin:30px 0}.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:22px}
.number{font-size:40px;font-weight:bold;margin:12px 0}input,button{background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:11px;border-radius:8px}
button{cursor:pointer}table{border-collapse:collapse;width:100%}td,th{padding:13px;border-bottom:1px solid #30363d;text-align:left;font-size:14px}
th{color:#8b949e}#status{color:#8b949e}.high{color:#ff7b72}.medium{color:#e3b341}
</style></head><body>
<header><div><small>SECURITY OPERATIONS / SYNTHETIC RANGE</small><h1>Blue Team Detection Lab</h1></div><span class="pill">LOCAL DEMO</span></header>
<p>Rules: failed-login burst · distinct-port sweep · suspicious process name</p>
<div><label>Local lab token <input id="token" type="password" placeholder="Enter LAB_TOKEN"></label>
<button id="refresh">Refresh dashboard</button> <span id="status" role="status"></span></div>
<div class="cards"><div class="card">EVENTS<div class="number" id="events">—</div></div><div class="card">ALERTS<div class="number" id="alerts">—</div></div><div class="card">MODE<div class="number">LAB</div></div></div>
<h2>Recent detections</h2><div style="overflow-x:auto"><table><thead><tr><th>Timestamp (UTC)</th><th>Rule</th><th>Severity</th><th>Host</th><th>Source</th><th>Evidence</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
const $=id=>document.getElementById(id);
async function refresh(){
  const headers={"X-Lab-Token":$("token").value};
  try{
    const [a,b]=await Promise.all([fetch("/api/stats",{headers}),fetch("/api/alerts",{headers})]);
    if(!a.ok||!b.ok)throw Error("API error: "+a.status+"/"+b.status);
    const stats=await a.json(),alerts=await b.json();
    $("events").textContent=stats.events;$("alerts").textContent=stats.alerts;
    $("rows").replaceChildren();
    for(const item of alerts){
      const tr=document.createElement("tr");
      for(const key of ["timestamp","rule","severity","host","source_ip","evidence"]){
        const td=document.createElement("td");td.textContent=item[key]??"";
        if(key==="severity")td.className=item[key];tr.append(td);
      }$("rows").append(tr);
    }
    $("status").textContent="Loaded "+alerts.length+" alerts";
  }catch(e){$("status").textContent=e.message}
}
$("refresh").addEventListener("click",refresh);
</script></body></html>
