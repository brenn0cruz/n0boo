name: Blue Team Lab checks
on:
  push:
    paths:
      - 'labs/blue-team-detection-lab/**'
      - '.github/workflows/blue-team-lab.yml'
  pull_request:
    paths:
      - 'labs/blue-team-detection-lab/**'
      - '.github/workflows/blue-team-lab.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Python rules tests
        working-directory: labs/blue-team-detection-lab
        run: python -m unittest discover -s tests -v
